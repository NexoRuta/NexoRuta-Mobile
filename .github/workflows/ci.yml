name: Mobile CI
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        capa: [Core, Api, Storage, Application]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pruebas portables
        run: dotnet test "tests/NexoRuta.Mobile.${{ matrix.capa }}.Tests" --configuration Release --logger 'trx;LogFileName=tests.trx' --results-directory resultados
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-${{ matrix.capa }}
          path: resultados
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Instalar workload fijado por el SDK
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Restaurar Android
        run: dotnet restore src/NexoRuta.Mobile/NexoRuta.Mobile.csproj -p:TargetFramework=net10.0-android -p:RuntimeIdentifier=android-arm64
      - name: Dependencias Android
        run: dotnet build src/NexoRuta.Mobile/NexoRuta.Mobile.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSdkLicenses=true
      - name: Compilar APK Release de verificación
        run: dotnet build src/NexoRuta.Mobile/NexoRuta.Mobile.csproj --configuration Release --framework net10.0-android -p:RuntimeIdentifier=android-arm64 -p:AndroidPackageFormats=apk --no-restore
      - name: Checksum del APK
        run: sha256sum src/NexoRuta.Mobile/bin/Release/net10.0-android/android-arm64/*-Signed.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-verificacion
          path: |
            src/NexoRuta.Mobile/bin/Release/net10.0-android/android-arm64/*-Signed.apk
            SHA256SUMS
          retention-days: 14
