name: Notify NexoRuta integration / mobile
run-name: Notify integration / mobile / ${{ github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    environment: nexoruta-demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dispatch this mobile SHA to NexoRuta
        env:
          NEXORUTA_INTEGRATION_TOKEN: ${{ secrets.NEXORUTA_INTEGRATION_TOKEN }}
        run: python3 scripts/release/dispatch-integration.py
